name: CI

on:
    - pull_request
    - push

jobs:
    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: "npm"
            - run: npm ci
            - run: npm run typecheck

    lint:
        name: Lint and fallow
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  # fallow resolves its rules against the changed files, so
                  # the history has to be there.
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: "npm"
            - run: npm ci
            - run: npm run lint
              env:
                  # Report the findings as inline annotations on the pull
                  # request instead of a wall of text in the log.
                  FALLOW_FORMAT: github-annotations

    test:
        name: Test (Node ${{matrix.node}})
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [22, 24]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{matrix.node}}
                  cache: "npm"
            - run: npm ci
            # The tests run in a headless Chromium.
            - run: npx playwright install --with-deps chromium
            # Fails when the coverage drops below 100%, see vite.config.ts.
            - run: npm run coverage

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [typecheck, lint, test]
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: "npm"
            - run: npm ci
            - run: npm run build
            - name: Upload build artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: build
                  path: build/
            - name: Update the health and coverage badges
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              run: |
                  npx playwright install --with-deps chromium
                  npm run coverage
                  npm run badges
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add .github/badges/health.svg .github/badges/coverage.json
                  git diff --quiet --cached || git commit -m "chore: update the health and coverage badges [skip ci]"
                  git push
